<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Municipality - Mobile Navigation</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    :root {
  --primary: #137fec;
  --bg-light: #f6f7f8;
  --text-dark: #111418;
  --text-muted: #617589;
}

* {
  box-sizing: border-box;
  font-family: "Public Sans", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-light);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Device */
.device {
  width: 100%;
  max-width: 400px;
  height: 800px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
  overflow: hidden;
  border: 1px solid #e5e7eb;
}

/* Drawer */
.drawer {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #f1f1f1;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand h2 {
  font-size: 18px;
  font-weight: 700;
  margin: 0;
}

.logo {
  width: 32px;
  height: 32px;
  color: var(--primary);
}

.close-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: #f0f2f4;
  cursor: pointer;
}

/* Profile */
.profile {
  padding: 24px 20px;
}

.profile-card {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--bg-light);
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #f1f1f1;
}

.avatar-wrapper {
  position: relative;
}

.avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCbXPHaifG8fDgg2neSHH3gLdHwMHp76gukPMmLcyeFOSfqGTXo3da7qnUqtlwiA4o_tjpxfjbuFs8oOTQhICJC-PNXw4EnE62hdCgtwEWMHtmFqp-CJnlf-2qSERXLEZDvpjJu0ernZRYAb78xZD9Gm9_elmoy9023LAOFsckK_pUrZ2DDs7nvOp1PBo2Ais4K0ROqPDY-gKqSiNUSz3EgfDhqzu5ESYY2OxCKN6yHOKdxuAhFQ8FCsV7NvdaNm234v5WwQVFuoMFi");
  background-size: cover;
}

.status {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 14px;
  height: 14px;
  background: #22c55e;
  border-radius: 50%;
  border: 2px solid #fff;
}

.name {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

.role {
  margin: 0;
  font-size: 14px;
  color: var(--text-muted);
}

/* Navigation */
.nav {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px 24px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  border-radius: 10px;
  color: var(--text-dark);
  text-decoration: none;
  margin-bottom: 8px;
}

.nav-item:hover {
  background: #f0f2f4;
}

.nav-item span {
  font-weight: 500;
}

.badge {
  background: #ef4444;
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 999px;
}

.active {
  background: rgba(19, 127, 236, 0.1);
  border-left: 4px solid var(--primary);
  color: var(--primary);
  font-weight: 700;
}

.fill {
  font-variation-settings: "FILL" 1;
}

/* Footer */
.footer {
  padding: 20px;
  border-top: 1px solid #f1f1f1;
}

.utility {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  width: 100%;
  border: none;
  background: transparent;
  cursor: pointer;
  color: #64748b;
}

.utility:hover {
  background: #f8fafc;
}

.logout {
  color: #ef4444;
}

.version {
  text-align: center;
  font-size: 10px;
  color: #94a3b8;
  margin-top: 16px;
}

/* Scrollbar */
.custom-scrollbar::-webkit-scrollbar {
  width: 4px;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #e5e7eb;
  border-radius: 20px;
}

  </style>
</head>

<body>
  <div class="device">
    <div class="drawer">

      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="logo">
            <!-- SVG LOGO -->
            <!-- (same SVG unchanged) -->
          </div>
          <h2>Smart Municipality</h2>
        </div>

        <button class="close-btn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </header>

      <!-- Profile -->
      <section class="profile">
        <div class="profile-card">
          <div class="avatar-wrapper">
            <div class="avatar"></div>
            <span class="status"></span>
          </div>
          <div class="profile-info">
            <p class="name">John Doe</p>
            <p class="role">Resident • Verified</p>
          </div>
        </div>
      </section>

      <!-- Navigation -->
      <nav class="nav custom-scrollbar">
        <a class="nav-item" href="#">
          <span class="material-symbols-outlined">home</span>
          <span>Home</span>
        </a>

        <a class="nav-item" href="#">
          <span class="material-symbols-outlined">description</span>
          <span>Permits & Licenses</span>
        </a>

        <a class="nav-item" href="#">
          <span class="material-symbols-outlined">newspaper</span>
          <span>News & Updates</span>
          <span class="badge">2</span>
        </a>

        <a class="nav-item" href="#">
          <span class="material-symbols-outlined">event</span>
          <span>Community Events</span>
        </a>

        <a class="nav-item active" href="#">
          <span class="material-symbols-outlined fill">campaign</span>
          <span>Public Complaints</span>
          <span class="material-symbols-outlined">chevron_right</span>
        </a>

        <a class="nav-item" href="#">
          <span class="material-symbols-outlined">call</span>
          <span>Contact Us</span>
        </a>
      </nav>

      <!-- Footer -->
      <footer class="footer">
        <button class="utility">
          <span class="material-symbols-outlined">settings</span>
          <span>Settings & Preferences</span>
        </button>

        <button class="utility logout">
          <span class="material-symbols-outlined">logout</span>
          <span>Log Out</span>
        </button>

        <p class="version">Version 2.4.0 • Smart Municipality Inc.</p>
      </footer>

    </div>
  </div>
</body>
</html>
